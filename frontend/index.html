<!DOCTYPE html>
<html>
<head>
    <title>Mahseer Spawning Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; }
        #map { height: 100vh; width: 100vw; }
        #side-panel { width: 100%; height: 75vh; position: fixed; bottom: 0; left: 0; background: #1e1e1e; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); overflow-y: auto; padding: 20px; box-sizing: border-box; display: none; z-index: 1000; border-radius: 20px 20px 0 0; }
        .panel-header { font-size: 1.4em; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .status-banner { padding: 12px; border-radius: 8px; margin: 15px 0; font-weight: bold; }
        .status-green { background: rgba(76, 175, 80, 0.2); border-left: 5px solid #4caf50; color: #81c784; }
        .status-yellow { background: rgba(255, 193, 7, 0.2); border-left: 5px solid #ffc107; color: #ffe082; }
        .status-red { background: rgba(244, 67, 54, 0.2); border-left: 5px solid #f44336; color: #ef9a9a; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .lang-bar { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 20px; display: flex; gap: 5px; }
        .lang-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.8em; padding: 5px 10px; border-radius: 15px; }
        .lang-btn.active { background: #3b82f6; color: white; }
        .map-controls { position: absolute; top: 60px; left: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .control-btn { background: #1e1e1e; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #333; color: white; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; }
        .chart-container { height: 180px; margin-top: 10px; display: none; }
        .favorite-spot { display: flex; align-items: center; gap: 10px; background: #252525; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('kn')">ಕನ್ನಡ</button>
        <button class="lang-btn" onclick="setLang('hi')">हिंदी</button>
    </div>

    <div class="map-controls">
        <button class="control-btn" onclick="toggleHeatmap()">🔥 Heatmap</button>
        <button class="control-btn" onclick="showFavorites()">⭐ My Spots</button>
    </div>

    <div id="map"></div>
    <div id="side-panel"><div id="panel-content"></div></div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modal-title">🚨 Report Incident</h3>
            <select id="report-category">
                <option value="Sand Mining">Sand Mining</option>
                <option value="Pollution">Pollution</option>
                <option value="Illegal Fishing">Illegal Fishing</option>
            </select>
            <textarea id="report-desc" placeholder="Details..."></textarea>
            <input type="file" id="report-image" accept="image/*" capture="camera">
            <button class="btn" onclick="submitReport()">Submit</button>
            <button class="btn" style="background:#444" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([12.2, 77.4], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let currentLat, currentLng, myChart, heatLayer, currentLang = 'en';

        const i18n = {
            en: { report: "Report Incident", trends: "View 24h Trends", save: "Save this Spot", msg: "Success", details: "Details..." },
            kn: { report: "ವರದಿ ಮಾಡಿ", trends: "24 ಗಂಟೆಗಳ ಪ್ರವೃತ್ತಿ", save: "ಈ ಸ್ಥಳವನ್ನು ಉಳಿಸಿ", msg: "ಯಶಸ್ವಿಯಾಗಿದೆ", details: "ವಿವರಗಳು..." },
            hi: { report: "रिपोर्ट करें", trends: "24 घंटे का रुझान", save: "इस जगह को सेव करें", msg: "सफल", details: "विवರಣ..." }
        };

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            alert(`Language switched to ${lang.toUpperCase()}`);
        }

        function toggleHeatmap() {
            if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; return; }
            fetch('/get-heatmap').then(res => res.json()).then(data => {
                heatLayer = L.heatLayer(data.points, { radius: 25, blur: 15, maxZoom: 10 }).addTo(map);
            });
        }

        map.on('click', (e) => {
            currentLat = e.latlng.lat; currentLng = e.latlng.lng;
            const zone = { zone_id: Date.now(), zone_name: `Point ${currentLat.toFixed(2)}`, lat: currentLat, lng: currentLng, current_data: {} };
            L.circleMarker([currentLat, currentLng], { radius: 8, color: '#3b82f6' }).addTo(map);
            fetchAssessment(zone);
        });

        function fetchAssessment(zone) {
            fetch('/assess-zone', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(zone) })
            .then(res => res.json()).then(data => openPanel(zone, data));
        }

        function openPanel(zone, data) {
            const panel = document.getElementById('side-panel');
            panel.style.display = 'block';
            const live = data.live_fetched_data;
            const t = i18n[currentLang];
            document.getElementById('panel-content').innerHTML = `
                <div class="panel-header">${zone.zone_name} <span onclick="this.parentElement.parentElement.parentElement.style.display='none'">✕</span></div>
                <div class="status-banner ${data.color === 'green' ? 'status-green' : data.color === 'yellow' ? 'status-yellow' : 'status-red'}">${data.alert}</div>
                <button class="btn" onclick="showTrends()">📈 ${t.trends}</button>
                <div class="chart-container" id="chartDiv"><canvas id="trendChart"></canvas></div>
                <button class="btn" style="background:#4caf50" onclick="saveSpot('${zone.zone_name}')">⭐ ${t.save}</button>
                <button class="btn" style="background:#e53935" onclick="document.getElementById('modal').style.display='flex'">🚨 ${t.report}</button>
            `;
        }

        function saveSpot(name) {
            let spots = JSON.parse(localStorage.getItem('fav_spots') || '[]');
            spots.push({ name, lat: currentLat, lng: currentLng });
            localStorage.setItem('fav_spots', JSON.stringify(spots));
            alert("Spot saved to 'My Spots'!");
        }

        function showFavorites() {
            let spots = JSON.parse(localStorage.getItem('fav_spots') || '[]');
            if (spots.length === 0) { alert("No saved spots yet. Click the map and click 'Save Spot'!"); return; }
            let list = spots.map(s => `<li>${s.name} (${s.lat.toFixed(2)})</li>`).join('');
            alert(`My Saved Spots:\n${spots.map(s => s.name).join('\n')}`);
        }

        function showTrends() {
            document.getElementById('chartDiv').style.display = 'block';
            fetch(`/get-trends?lat=${currentLat}&lng=${currentLng}`).then(res => res.json()).then(data => {
                const ctx = document.getElementById('trendChart').getContext('2d');
                if (myChart) myChart.destroy();
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{ label: 'Temp', data: data.temp_data, borderColor: '#ff9800' }, { label: 'DO', data: data.do_data, borderColor: '#2196f3' }]
                    },
                    options: { maintainAspectRatio: false }
                });
            });
        }

        function submitReport() {
            const formData = new FormData();
            formData.append('lat', currentLat); formData.append('lng', currentLng);
            formData.append('category', document.getElementById('report-category').value);
            formData.append('description', document.getElementById('report-desc').value);
            const img = document.getElementById('report-image').files[0];
            if (img) formData.append('image', img);
            fetch('/report-incident', { method: 'POST', body: formData }).then(res => res.json()).then(d => {
                alert(d.message); document.getElementById('modal').style.display = 'none';
            });
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
