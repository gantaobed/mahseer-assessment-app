<!DOCTYPE html>
<html>
<head>
    <title>Cauvery Sentinel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #0b0f1a; color: white; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #1a1a1a; }
        .side-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 30px 30px 0 0; z-index: 1000; display: none; padding: 25px; box-sizing: border-box; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .status { padding: 15px; border-radius: 12px; font-weight: bold; margin: 15px 0; border-left: 8px solid #444; }
        .green { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
        .red { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .gray { background: rgba(100, 116, 139, 0.2); border-color: #64748b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; text-align: center; }
        .label { font-size: 0.7em; color: #94a3b8; display: block; margin-bottom: 4px; }
        .val { font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="side-panel" class="side-panel"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([11.8, 77.2], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        map.on('click', (e) => {
            const lat = e.latlng.lat, lng = e.latlng.lng;
            fetch('/assess-zone', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({lat, lng}) })
            .then(res => res.json()).then(data => {
                const panel = document.getElementById('side-panel');
                panel.style.display = 'block';
                const d = data.details;
                panel.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <h2 style="margin:0">${lat.toFixed(3)}, ${lng.toFixed(3)}</h2>
                        <button onclick="document.getElementById('side-panel').style.display='none'" style="background:none; border:none; color:white; font-size:1.5em">✕</button>
                    </div>
                    <div class="status ${data.color}">${data.alert}</div>
                    <div class="grid">
                        <div class="card"><span class="label">TEMP</span><span class="val">${d.temp}°C</span></div>
                        <div class="card"><span class="label">MINING</span><span class="val" style="color:#ef4444">${d.mining}%</span></div>
                    </div>
                    <div id="trendDiv" style="margin-top:20px; font-size:0.8em; color:#94a3b8">Loading local trends...</div>
                `;
                // Load trends separately so it doesn't block the main UI
                fetch(`/get-area-trends?lat=${lat}&lng=${lng}`).then(r => r.json()).then(tData => {
                    const div = document.getElementById('trendDiv');
                    if (tData.trends.length === 0) { div.innerHTML = "No historical data for this 10km zone."; return; }
                    div.innerHTML = "<b>Recent Visits in this area:</b><br>" + tData.trends.map(t => `${t.time}: ${t.mining}% risk`).join('<br>');
                });
            });
        });
    </script>
</body>
</html>
