<!DOCTYPE html>
<html>
<head>
    <title>Cauvery Sentinel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #0b0f1a; color: white; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #1a1a1a; }
        .side-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-radius: 30px 30px 0 0; z-index: 1000; display: none; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status { padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
        .green { background: rgba(34, 197, 94, 0.2); border-left: 5px solid #22c55e; }
        .red { background: rgba(239, 68, 68, 0.2); border-left: 5px solid #ef4444; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="side-panel" class="side-panel"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Set center to Moyar Valley / Sangama area
        const map = L.map('map').setView([11.8, 77.2], 8);

        // Standard Reliable Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        map.on('click', (e) => {
            fetch('/assess-zone', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lat: e.latlng.lat, lng: e.latlng.lng})
            })
            .then(res => res.json())
            .then(data => {
                const panel = document.getElementById('side-panel');
                panel.style.display = 'block';
                panel.innerHTML = `
                    <div class="header">
                        <h2 style="margin:0">${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)}</h2>
                        <button onclick="document.getElementById('side-panel').style.display='none'" style="background:none; border:none; color:white; font-size:1.5em">✕</button>
                    </div>
                    <div class="status ${data.color === 'green' ? 'green' : 'red'}">${data.alert}</div>
                    <p>Bed Temp: ${data.live ? data.live.temp : '--'}°C</p>
                    <p>Oxygen: ${data.live ? data.live.do : '--'} mg/L</p>
                `;
            });
        });
    </script>
</body>
</html>
