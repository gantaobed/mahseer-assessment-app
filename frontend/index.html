<!DOCTYPE html>
<html>
<head>
    <title>Mahseer Spawning Intelligence Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { 
            margin: 0; padding: 0; display: flex; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; color: #ffffff; 
            font-size: 16px;
        }
        #map { height: 100vh; flex-grow: 1; }
        #side-panel {
            width: 420px; height: 100vh; background: #1e1e1e;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5); overflow-y: auto;
            padding: 25px; box-sizing: border-box; display: none; z-index: 1000;
        }

        /* Mobile Responsive Override */
        @media (max-width: 600px) {
            body { font-size: 18px; }
            #side-panel {
                width: 100%; height: 60vh; position: fixed; bottom: 0; left: 0;
                box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
                padding: 20px;
            }
            .instruction-box { display: none; }
            .panel-header { font-size: 1.6em; }
            .metric-title { font-size: 0.9em; }
            .metric-value { font-size: 1.2em; }
            .status-banner { font-size: 1.1em; }
            .checkbox-label { font-size: 1.1em; padding: 5px 0; }
        }
        .panel-header { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .status-banner { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; line-height: 1.4; font-size: 0.95em; }
        .status-green { background: rgba(46, 125, 50, 0.2); border-left: 5px solid #4caf50; color: #81c784; }
        .status-yellow { background: rgba(249, 168, 37, 0.2); border-left: 5px solid #fbc02d; color: #fff59d; }
        .status-red { background: rgba(198, 40, 40, 0.2); border-left: 5px solid #e53935; color: #ef9a9a; }
        .metric-group { margin-bottom: 15px; background: #252525; padding: 12px; border-radius: 6px; }
        .metric-title { font-size: 0.8em; color: #aaaaaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .metric-value { font-size: 1.1em; font-weight: 500; }
        .alert-text { color: #e53935; font-weight: bold; }
        .instruction-box {
            position: absolute; top: 15px; right: 440px; background: rgba(30, 30, 30, 0.9);
            padding: 10px 15px; border-radius: 8px; z-index: 1000; font-size: 0.9em; border: 1px solid #444; pointer-events: none;
        }
        .controls-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.95em; cursor: pointer; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; text-align: center; display: block; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .btn-secondary { background: #4b5563; }
        .btn-secondary:hover { background: #374151; }
        #history-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content { background: #1e1e1e; width: 80%; max-height: 80vh; border-radius: 8px; padding: 25px; overflow-y: auto; border: 1px solid #444; }
        .history-item { padding: 10px; border-bottom: 1px solid #333; font-size: 0.9em; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="instruction-box">💡 Click anywhere on the map to evaluate Mahseer spawning potential using live internet weather telemetry.</div>
    
    <div id="map"></div>
    <div id="side-panel"><div id="panel-content"></div></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([11.8, 77.2], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const initialZones = [
          { zone_id: 8, zone_name: "Sangama Confluence (Predictive Risk)", lat: 12.2743, lng: 77.4431, current_data: { sand_mining_present: false, upstream_mining_active: true } },
          { zone_id: 9, zone_name: "T. Narasipura (Critical Mining)", lat: 12.1950, lng: 76.9030, current_data: { sand_mining_present: true, upstream_mining_active: false } },
          { zone_id: 10, zone_name: "Kanakapura Catchment", lat: 12.5450, lng: 77.4200, current_data: { sand_mining_present: false, upstream_mining_active: false } },
          { zone_id: 11, zone_name: "Moyar River Valley (Pristine)", lat: 11.5500, lng: 76.9500, current_data: { sand_mining_present: false, upstream_mining_active: false } },
          { zone_id: 12, zone_name: "Pambar Tributary (Kerala)", lat: 10.2800, lng: 77.2600, current_data: { sand_mining_present: false, upstream_mining_active: false } }
        ];

        function renderMarker(zone) {
            fetchAssessment(zone, (assessment, markerColor) => {
                const marker = L.circleMarker([zone.lat, zone.lng], {
                    color: markerColor, fillColor: markerColor, fillOpacity: 0.8, radius: 12
                }).addTo(map);

                // Auto-open panel for new markers
                openPanel(zone, assessment, markerColor);

                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    openPanel(zone, assessment, markerColor);
                });
            });
        }

        function fetchAssessment(zone, callback) {
            console.log("Fetching assessment for:", zone.zone_name);
            fetch('/assess-zone', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    zone_id: zone.zone_id,
                    zone_name: zone.zone_name,
                    lat: zone.lat,
                    lng: zone.lng,
                    ...zone.current_data
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('Network response was not ok');
                return res.json();
            })
            .then(assessment => {
                console.log("Assessment received:", assessment);
                callback(assessment, assessment.color);
            })
            .catch(error => {
                console.error('Error fetching assessment:', error);
                alert("Failed to fetch assessment data. Please check your internet connection.");
            });
        }

        function openPanel(zone, assessment, markerColor) {
            const panel = document.getElementById('side-panel');
            panel.style.display = 'block';

            const bannerClass = markerColor === 'green' ? 'status-green' : markerColor === 'yellow' ? 'status-yellow' : 'status-red';
            const liveInfo = assessment.live_fetched_data || {};

            document.getElementById('panel-content').innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="panel-header" style="margin-bottom: 0;">${zone.zone_name}</div>
                    <button onclick="document.getElementById('side-panel').style.display='none'" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">✕</button>
                </div>
                <br>
                <div class="status-banner ${bannerClass}" id="panel-alert">
                    ${assessment.alert}
                </div>

                <div class="metric-group">
                    <div class="metric-title">Location Coordinates</div>
                    <div class="metric-value">Lat: ${zone.lat.toFixed(4)}, Lng: ${zone.lng.toFixed(4)}</div>
                </div>

                <div class="metric-group">
                    <div class="metric-title">Live Environmental Telemetry (Open-Meteo)</div>
                    <div class="metric-value">Bed Water Temp: ${liveInfo.temp_c || 22}°C (Ideal: 18-24°C)</div>
                    <div class="metric-value">Oxygen Solubility (DO): ${liveInfo.do_mg_l || 7.8} mg/L (Min: >7.5)</div>
                    <div class="metric-value">River Flow Velocity: ${liveInfo.flow || 1.1} m/s</div>
                    <div class="metric-value">Precipitation: ${liveInfo.rainfall_mm || 0} mm</div>
                    <div class="metric-value">Acidity (pH): ${liveInfo.ph || 7.8}</div>
                </div>

                <div class="metric-group">
                    <div class="metric-title">Interactive Threat Simulation Controls</div>
                    <div class="controls-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="toggle-mining" ${zone.current_data.sand_mining_present ? 'checked' : ''} onchange="updateThreats(${zone.lat}, ${zone.lng}, '${zone.zone_name}', ${zone.zone_id})">
                            Active Local Sand Mining (Bed Destruction)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="toggle-upstream" ${zone.current_data.upstream_mining_active ? 'checked' : ''} onchange="updateThreats(${zone.lat}, ${zone.lng}, '${zone.zone_name}', ${zone.zone_id})">
                            Active Upstream Extraction (Silt Drift)
                        </label>
                    </div>
                </div>
            `;
        }

        function updateThreats(lat, lng, zoneName, zoneId) {
            const miningPresent = document.getElementById('toggle-mining').checked;
            const upstreamActive = document.getElementById('toggle-upstream').checked;

            const updatedZone = {
                zone_id: zoneId,
                zone_name: zoneName,
                lat: lat,
                lng: lng,
                current_data: {
                    sand_mining_present: miningPresent,
                    upstream_mining_active: upstreamActive,
                    substrate_weight: 1.0
                }
            };

            fetch('/assess-zone', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(updatedZone)
            })
            .then(res => res.json())
            .then(newAssessment => {
                const banner = document.getElementById('panel-alert');
                const markerColor = newAssessment.color;
                banner.className = `status-banner ${markerColor === 'green' ? 'status-green' : markerColor === 'yellow' ? 'status-yellow' : 'status-red'}`;
                banner.innerHTML = newAssessment.alert;
            });
        }

        initialZones.forEach(zone => renderMarker(zone));

        map.on('click', (e) => {
            const customLat = e.latlng.lat;
            const customLng = e.latlng.lng;
            const dynamicZone = {
                zone_id: Math.floor(Math.random() * 9000) + 1000,
                zone_name: `Spawning Point (${customLat.toFixed(2)}, ${customLng.toFixed(2)})`,
                lat: customLat,
                lng: customLng,
                current_data: { sand_mining_present: false, upstream_mining_active: false }
            };
            renderMarker(dynamicZone);
        });

        function openHistoryModal() {
            document.getElementById('history-modal').style.display = 'flex';
            fetch('/history')
                .then(res => res.json())
                .then(data => {
                    const listContainer = document.getElementById('history-list');
                    if (data.history.length === 0) {
                        listContainer.innerHTML = '<p>No records found in database.</p>';
                        return;
                    }
                    listContainer.innerHTML = data.history.map(item => `
                        <div class="history-item">
                            <strong>[${item.timestamp}]</strong> ${item.zone_name} — 
                            <span style="color: ${item.status_color === 'green' ? '#4caf50' : item.status_color === 'yellow' ? '#fbc02d' : '#e53935'}; text-transform: uppercase; font-weight: bold;">${item.status_color}</span> 
                            (Rain: ${item.rainfall_mm}mm)
                        </div>
                    `).join('');
                });
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').style.display = 'none';
        }
    </script>
</body>
</html>
